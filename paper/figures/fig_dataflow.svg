<text x="8" y="108" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" font-weight="bold" font-style="normal" fill="#1a1a1a">Stage 2 detail — one adapter per provider (all issued concurrently; the search returns when every adapter has settled)</text>
