<text x="365.0" y="283.636" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.4" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555555">ai:analyzePaper per paper → Groq POST</text>
<text x="365.0" y="293.884" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.4" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555555">prompt = title + abstract + free-text task;</text>
<text x="365.0" y="304.13200000000006" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.4" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555555">answer written to analysis/&lt;title&gt;.md</text>
