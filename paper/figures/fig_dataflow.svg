<text x="150" y="138.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.6" text-anchor="start" font-weight="normal" font-style="normal" fill="#1a1a1a">1 GET  per_page = 3·limit  (relevance)</text>
<text x="432" y="138.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.6" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">15 s</text>
