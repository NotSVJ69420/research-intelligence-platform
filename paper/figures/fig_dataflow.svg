<text x="432" y="189.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.6" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">15 s</text>
<rect x="8" y="196" width="130" height="14" rx="2" fill="#dcebf5" stroke="#1a1a1a" stroke-width="0.8"/>
<text x="14" y="206.5" font-family="Liberation Mono, Courier New, monospace" font-size="8.8" text-anchor="start" font-weight="normal" font-style="normal" fill="#1a1a1a">europe_pmc</text>
<text x="150" y="206.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.6" text-anchor="start" font-weight="normal" font-style="normal" fill="#1a1a1a">1 GET  + up to limit Crossref look-ups for PDF</text>
<text x="432" y="206.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.6" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">15 s / 3 s</text>
<rect x="8" y="213" width="130" height="14" rx="2" fill="#dcebf5" stroke="#1a1a1a" stroke-width="0.8"/>
