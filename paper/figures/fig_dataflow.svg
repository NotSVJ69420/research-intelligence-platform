<text x="550.4" y="55.879999999999995" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.0" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555555">after dedup; global</text>
<text x="550.4" y="65.64" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.0" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555555">sort by year or cites</text>
<line x1="484.79999999999995" y1="45.0" x2="494.4" y2="45.0" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>
