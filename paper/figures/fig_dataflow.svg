<text x="150" y="223.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.6" text-anchor="start" font-weight="normal" font-style="normal" fill="#1a1a1a">ESearch → 350 ms spacing → EFetch (XML)</text>
<text x="432" y="223.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.6" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">25 s</text>
<text x="8" y="246" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" font-weight="bold" font-style="normal" fill="#1a1a1a">Downstream use of the result list</text>
