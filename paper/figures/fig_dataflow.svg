<text x="307.2" y="41.24" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.0" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555555">6 normalizers →</text>
<text x="307.2" y="51.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.0" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555555">canonical schema;</text>
<text x="307.2" y="60.760000000000005" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.0" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555555">rank, keep top-limit</text>
<text x="307.2" y="70.52" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.0" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555555">per provider</text>
<line x1="241.6" y1="45.0" x2="251.2" y2="45.0" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>
<rect x="372.79999999999995" y="8" width="112" height="74" rx="3" fill="#fbeccb" stroke="#1a1a1a" stroke-width="1"/>
<text x="428.79999999999995" y="34.36" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1a1a1a">4  Deduplicate</text>
<text x="428.79999999999995" y="46.12" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.0" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555555">keys: DOI | source:id |</text>
<text x="428.79999999999995" y="55.879999999999995" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.0" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555555">SHA-256(title|author|yr);</text>
