<text x="150" y="155.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.6" text-anchor="start" font-weight="normal" font-style="normal" fill="#1a1a1a">1 GET  3·limit; adapter-level 3 s throttle</text>
<text x="432" y="155.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.6" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1a1a1a">30 s</text>
