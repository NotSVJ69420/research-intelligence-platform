<text x="115.0" y="293.884" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.4" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555555">temp file → copy to raw_papers/&lt;title&gt;--&lt;uuid&gt;.pdf</text>
