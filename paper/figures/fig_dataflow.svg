<text x="620.0" y="271.468" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9.6" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1a1a1a">Library view</text>
<text x="620.0" y="283.636" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.4" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555555">scan raw_papers/ + SELECT * FROM papers;</text>
<text x="620.0" y="293.884" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.4" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555555">match by UUID suffix, stored path or</text>
<text x="620.0" y="304.13200000000006" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.4" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555555">source_id substring; else 'External File'</text>
