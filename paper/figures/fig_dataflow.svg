<text x="185.6" y="46.12" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.0" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555555">Promise.allSettled</text>
<text x="185.6" y="55.879999999999995" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.0" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555555">over all adapters;</text>
<text x="185.6" y="65.64" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.0" text-anchor="middle" font-weight="normal" font-style="normal" fill="#555555">per-host timeouts</text>
